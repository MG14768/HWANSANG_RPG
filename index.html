<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>환상RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0c0a13;
    --bg-panel:#181425;
    --bg-panel-2:#211b32;
    --line:#3a3050;
    --gold:#c9a227;
    --gold-bright:#e6c34a;
    --blood:#8b2a3a;
    --blood-bright:#c1435a;
    --mystic:#7a5fc7;
    --parchment:#ece2c6;
    --dim:#9c93b0;
    --green:#5c9a6b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 10%, rgba(122,95,199,0.12), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(139,42,58,0.14), transparent 45%),
      var(--bg-deep);
    color:var(--parchment);
    font-family:'Noto Serif KR', serif;
    min-height:100vh;
    padding:24px 12px;
  }
  h1,h2,h3,.display{
    font-family:'Black Han Sans', sans-serif;
    letter-spacing:1px;
  }
  #app{
    max-width:920px;
    margin:0 auto;
  }
  .frame{
    position:relative;
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    border:1px solid var(--line);
    border-radius:4px;
    padding:22px;
    box-shadow:0 0 0 1px rgba(201,162,39,0.08), 0 18px 40px rgba(0,0,0,0.45);
  }
  .frame::before,.frame::after{
    content:"";
    position:absolute;
    width:14px;height:14px;
    border:2px solid var(--gold);
    opacity:0.55;
  }
  .frame::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .frame::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
  .title-row{
    text-align:center;
    margin-bottom:6px;
  }
  .title-row h1{
    font-size:44px;
    margin:0;
    color:var(--gold-bright);
    text-shadow:0 0 18px rgba(230,195,74,0.35);
  }
  .title-row .sub{
    color:var(--dim);
    font-size:13px;
    letter-spacing:3px;
    text-transform:uppercase;
  }
  .screen{display:none;}
  .screen.active{display:block;}
  .center{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  input[type=text]{
    background:var(--bg-deep);
    border:1px solid var(--line);
    color:var(--parchment);
    font-family:'Noto Serif KR', serif;
    font-size:16px;
    padding:10px 14px;
    border-radius:3px;
    width:260px;
    text-align:center;
  }
  input[type=text]:focus{ outline:none; border-color:var(--gold); }
  button{
    font-family:'Noto Serif KR', serif;
    font-weight:600;
    background:var(--bg-panel-2);
    color:var(--parchment);
    border:1px solid var(--line);
    border-radius:3px;
    padding:11px 18px;
    cursor:pointer;
    font-size:14.5px;
    transition:border-color .15s, transform .1s, background .15s;
  }
  button:hover:not(:disabled){ border-color:var(--gold); background:#291f42; transform:translateY(-1px); }
  button:disabled{ opacity:0.4; cursor:not-allowed; }
  button.primary{ background:linear-gradient(180deg,#3a2c5c,#251c3d); border-color:var(--gold); color:var(--gold-bright); }
  button.danger{ border-color:var(--blood); color:#f0b7bf; }
  button.danger:hover{ background:#3a1620; }
  button.wide{ width:100%; text-align:left; padding:14px 16px; }
  .btn-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; }
  .btn-grid.cols1{ grid-template-columns:1fr; }
  .flavor{
    color:var(--dim);
    font-size:14px;
    line-height:1.7;
    white-space:pre-line;
  }
  .layout{ display:grid; grid-template-columns:220px 1fr; gap:16px; }
  @media (max-width:680px){ .layout{ grid-template-columns:1fr; } }
  .sidebar{
    background:var(--bg-deep);
    border:1px solid var(--line);
    border-radius:4px;
    padding:16px;
    align-self:start;
  }
  .side-name{ font-family:'Black Han Sans'; color:var(--gold-bright); font-size:19px; margin-bottom:2px; }
  .side-role{ color:var(--mystic); font-size:12px; margin-bottom:12px; }
  .stat-row{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--dim); margin-top:10px; margin-bottom:3px; }
  .bar-bg{ background:#0a0812; border:1px solid var(--line); border-radius:8px; height:10px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:8px; transition:width .3s; }
  .bar-hp{ background:linear-gradient(90deg,#7a2230,var(--blood-bright)); }
  .bar-mp{ background:linear-gradient(90deg,#3a2f6e,var(--mystic)); }
  .bar-exp{ background:linear-gradient(90deg,#8a6a10,var(--gold-bright)); }
  .weapon-line{ margin-top:14px; font-size:13px; color:var(--parchment); border-top:1px dashed var(--line); padding-top:10px; }
  .gold-line{ margin-top:6px; font-size:13px; color:var(--gold-bright); }
  .main{ min-height:340px; }
  .log{
    background:var(--bg-deep);
    border:1px solid var(--line);
    border-radius:4px;
    padding:12px 14px;
    font-size:13.5px;
    line-height:1.75;
    color:var(--parchment);
    height:130px;
    overflow-y:auto;
    margin-bottom:14px;
    white-space:pre-line;
  }
  .log b{ color:var(--gold-bright); }
  .enemy-card{
    text-align:center;
    padding:16px 10px 10px;
    margin-bottom:12px;
  }
  .enemy-emoji{ font-size:64px; filter:drop-shadow(0 6px 10px rgba(0,0,0,0.5)); }
  .enemy-name{ font-family:'Black Han Sans'; font-size:20px; color:var(--blood-bright); margin:4px 0 8px; }
  .mini-bar-wrap{ width:220px; margin:0 auto; }
  .mini-label{ font-size:11px; color:var(--dim); display:flex; justify-content:space-between; margin-bottom:2px;}
  .shop-item{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--bg-deep); border:1px solid var(--line); border-radius:4px;
    padding:10px 14px; margin-bottom:8px;
  }
  .shop-item .info b{ color:var(--gold-bright); }
  .shop-item .info .desc{ color:var(--dim); font-size:12px; }
  .tag{ display:inline-block; font-size:10.5px; padding:1px 6px; border-radius:8px; border:1px solid var(--line); color:var(--dim); margin-left:6px; }
  .quest-card{
    background:var(--bg-deep); border:1px solid var(--line); border-radius:4px;
    padding:12px 14px; margin-bottom:10px;
  }
  .quest-card.done{ border-color:var(--gold); }
  .quest-title{ font-weight:700; color:var(--parchment); font-size:14.5px; }
  .quest-desc{ color:var(--dim); font-size:12.5px; margin:4px 0 8px; }
  .quest-progress{ font-size:12px; color:var(--mystic); }
  .lb-row{ display:flex; justify-content:space-between; padding:8px 12px; border-bottom:1px solid var(--line); font-size:13.5px; }
  .lb-row.me{ background:rgba(201,162,39,0.08); border-radius:3px; }
  .back-row{ margin-top:14px; }
  .badge-op{ font-size:11px; color:var(--mystic); border:1px solid var(--mystic); border-radius:8px; padding:1px 8px; }
  .modal-msg{ font-size:15px; line-height:1.9; color:var(--parchment); white-space:pre-line; margin-bottom:18px; }
  .footnote{ text-align:center; color:var(--dim); font-size:11px; margin-top:16px; }
  .toast{
    position:fixed; left:50%; top:18px; transform:translateX(-50%);
    background:#241a34; border:1px solid var(--gold); color:var(--gold-bright);
    padding:10px 18px; border-radius:4px; font-size:13.5px; z-index:50;
    box-shadow:0 10px 24px rgba(0,0,0,0.5);
    animation:fadein .2s ease-out;
  }
  @keyframes fadein{ from{opacity:0; transform:translate(-50%,-8px);} to{opacity:1; transform:translate(-50%,0);} }
</style>
</head>
<body>
<div id="app">
  <div class="title-row">
    <h1>환상RPG</h1>
    <div class="sub">Fantasy Realm · Lv.1 ~ Lv.50</div>
  </div>

  <div class="frame">

    <!-- 시작 화면 -->
    <div class="screen active" id="screen-start">
      <div class="center">
        <p class="flavor" style="text-align:center;max-width:480px;">안개 낀 관문 앞에 선다.
낡은 표지판에는 이렇게 적혀 있다 — "이름을 밝히지 않은 자는 들어올 수 없다."</p>
        <input type="text" id="nickname-input" placeholder="닉네임을 입력하세요" maxlength="10">
        <input type="password" id="admin-pass-input" placeholder="관리자 비밀번호 (일반은 공백)" maxlength="10" style="background:var(--bg-deep);border:1px solid var(--line);color:var(--parchment);font-family:'Noto Serif KR', serif;font-size:16px;padding:10px 14px;border-radius:3px;width:260px;text-align:center;margin-top:6px;">
        <input type="password" id="char-pin-input" placeholder="캐릭터 비밀번호 (잠금용, 선택)" maxlength="10" style="background:var(--bg-deep);border:1px solid var(--line);color:var(--parchment);font-family:'Noto Serif KR', serif;font-size:16px;padding:10px 14px;border-radius:3px;width:260px;text-align:center;margin-top:6px;">
        <div class="btn-grid" style="width:260px;margin-top:8px;position:relative;z-index:10;">
          <button class="primary" onclick="onEnterClicked()" style="position:relative;z-index:11;cursor:pointer;">관문 통과하기</button>
          <button onclick="onDirectContinueClicked()" style="position:relative;z-index:11;cursor:pointer;">이어하기</button>
        </div>
      </div>
    </div>

    <!-- 이어하기 확인 -->
    <div class="screen" id="screen-continue">
      <div class="center">
        <p class="modal-msg" id="continue-text"></p>
        <div class="btn-grid" style="max-width:360px;">
          <button class="primary" onclick="loadSavedGame()">이어하기</button>
          <button class="danger" onclick="overwriteNewGame()">새로 시작 (덮어쓰기)</button>
          <button onclick="showScreen('screen-start')" style="grid-column: span 2;">← 관문으로 돌아가기</button>
        </div>
      </div>
    </div>

    <!-- 오프닝 이벤트 -->
    <div class="screen" id="screen-event">
      <h2 style="color:var(--gold-bright);">— 이벤트 —</h2>
      <p class="modal-msg" id="event-text"></p>
      <div class="center">
        <button class="primary" onclick="closeEvent()">눈을 뜨다</button>
      </div>
    </div>

    <!-- 메인 게임 (사이드바 + 컨텐츠) -->
    <div class="screen" id="screen-game">
      <div class="layout">
        <div class="sidebar">
          <div class="side-name" id="s-name">-</div>
          <div class="side-role">환상의 세계의 모험자 <span class="badge-op" id="s-op" style="display:none;">운영자</span></div>

          <div class="stat-row"><span>레벨</span><span id="s-level">1</span></div>
          <div class="stat-row"><span>EXP</span><span id="s-exp-num">0/0</span></div>
          <div class="bar-bg"><div class="bar-fill bar-exp" id="s-exp-bar" style="width:0%;"></div></div>

          <div class="stat-row"><span>HP</span><span id="s-hp-num">0/0</span></div>
          <div class="bar-bg"><div class="bar-fill bar-hp" id="s-hp-bar" style="width:100%;"></div></div>

          <div class="stat-row"><span>MP</span><span id="s-mp-num">0/0</span></div>
          <div class="bar-bg"><div class="bar-fill bar-mp" id="s-mp-bar" style="width:100%;"></div></div>

          <div class="weapon-line">🗡️ 장착 무기: <b id="s-weapon">-</b><br>⚔️ 공격력: <b id="s-atk">-</b></div>
          <div class="gold-line">💰 골드: <b id="s-gold">0</b></div>
        </div>

        <div class="main">
          <div class="log" id="log-box"></div>
          <div id="content-area"></div>
        </div>
      </div>
    </div>

  </div>
  <div class="footnote">이 세계의 모든 불운은 의도된 것입니다 (아마도). · 다른 사람과 이 페이지를 공유하면 같은 세계에서 함께 모험할 수 있습니다.</div>
</div>

<script>
/* =========================================================
   환상RPG — 데이터 정의
   ========================================================= */
const OPERATOR_NAME = "환상의 관리자"; // 게임 내 세계관 상 운영자 지칭

const WEAPONS = [
  { id:'wood',   name:'낡은 나무검',     atk:5,   price:0,    reqLevel:1  },
  { id:'steel',  name:'강철검',          atk:16,  price:120,  reqLevel:1  },
  { id:'silver', name:'은빛 장검',       atk:32,  price:380,  reqLevel:5  },
  { id:'staff',  name:'마법사의 지팡이', atk:52,  price:850,  reqLevel:10 },
  { id:'black',  name:'흑염의 대검',     atk:92,  price:2100, reqLevel:20 },
  { id:'dragon', name:'용살자의 검',     atk:155, price:6200, reqLevel:35 },
  { id:'moune',  name:'어둠모운(망치)',  atk:250, price:18000,reqLevel:45 },
];

const ITEMS_SHOP = [
  { id:'pot_small', name:'소형 체력 물약', type:'hp', value:40,  price:20, desc:'HP 40 회복' },
  { id:'pot_mid',   name:'중형 체력 물약', type:'hp', value:120, price:65, desc:'HP 120 회복' },
  { id:'pot_mp',    name:'마나 물약',      type:'mp', value:30,  price:30, desc:'MP 30 회복' },
  { id:'smoke',     name:'도주용 연막탄',  type:'flee', value:1, price:15, desc:'전투에서 100% 도주' },
];

const AREAS = [
  { id:'field',   name:'초원',   reqLevel:1,  monsters:['slime','raccoon'] },
  { id:'cave',    name:'동굴',   reqLevel:5,  monsters:['goblin','skeleton'] },
  { id:'swamp',   name:'늪지',   reqLevel:8,  monsters:['snake','spider'] },
  { id:'mount',   name:'산맥',   reqLevel:15, monsters:['bear','skeleton'] },
  { id:'volcano', name:'화산 지대', reqLevel:18, monsters:['fire_element','magma_golem'] },
  { id:'abyss',   name:'심연',   reqLevel:25, monsters:['dragon','sarian'] },
  { id:'castle',  name:'암흑성', reqLevel:30, monsters:['dark_knight','vampire'] },
  { id:'heaven',  name:'천상계', reqLevel:40, monsters:['seraph','dragon'] },
];

const MONSTERS = {
  slime:        { name:'슬라임',       emoji:'🟢', tier:0.4,  atier:0.32, dropName:'슬라임 젤리',   dropVal:8  },
  goblin:       { name:'고블린',       emoji:'👺', tier:0.65, atier:0.55, dropName:'고블린 이빨',   dropVal:14 },
  raccoon:      { name:'너구리',       emoji:'🦝', tier:0.55, atier:0.6,  dropName:'너구리 꼬리',   dropVal:12, thief:true },
  skeleton:     { name:'스켈레톤',     emoji:'💀', tier:0.85, atier:0.72, dropName:'낡은 뼛조각',   dropVal:18 },
  snake:        { name:'독사',         emoji:'🐍', tier:0.75, atier:0.65, dropName:'독니',         dropVal:22 },
  spider:       { name:'거대 독거미',   emoji:'🕷️', tier:0.95, atier:0.8,  dropName:'거미 독주머니', dropVal:35 },
  bear:         { name:'곰',           emoji:'🐻', tier:1.15, atier:0.95, dropName:'곰 발톱',       dropVal:26 },
  fire_element: { name:'화염 정령',     emoji:'🔥', tier:1.4,  atier:1.2,  dropName:'정령의 불씨',   dropVal:50 },
  magma_golem:  { name:'마그마 골렘',   emoji:'🌋', tier:1.8,  atier:1.4,  dropName:'마그마 핵',     dropVal:80 },
  dark_knight:  { name:'암흑 기사',     emoji:'🤺', tier:2.2,  atier:1.8,  dropName:'검은 투구',     dropVal:150 },
  vampire:      { name:'뱀파이어 로드', emoji:'🧛', tier:2.8,  atier:2.2,  dropName:'흡혈귀의 망토', dropVal:300, boss:true },
  seraph:       { name:'천상의 세라핌', emoji:'👼', tier:3.5,  atier:2.6,  dropName:'빛의 날개깃',   dropVal:600, boss:true },
  dragon:       { name:'투명드래곤',   emoji:'🌫️', tier:2.6,  atier:1.6,  dropName:'투명한 비늘',   dropVal:120, dodge:0.4, boss:true },
  sarian:       { name:'운영자 서리안', emoji:'🔨', tier:3.2, atier:2.1, dropName:'어둠모운의 파편', dropVal:1000, dodge:0.3, boss:true },
};

const QUESTS = [
  { id:'q1', name:'첫 사냥',       desc:'슬라임을 3마리 처치한다.',       type:'kill', monster:'slime',    goal:3,  rewardExp:40,  rewardGold:30  },
  { id:'q2', name:'고블린 소탕',   desc:'고블린을 5마리 처치한다.',       type:'kill', monster:'goblin',   goal:5,  rewardExp:120, rewardGold:90  },
  { id:'q3', name:'도둑 잡기',     desc:'너구리를 4마리 처치한다.',       type:'kill', monster:'raccoon',  goal:4,  rewardExp:100, rewardGold:80  },
  { id:'q4', name:'뼈의 무덤',     desc:'스켈레톤을 6마리 처치한다.',     type:'kill', monster:'skeleton', goal:6,  rewardExp:220, rewardGold:180 },
  { id:'q5', name:'숲의 포식자',   desc:'곰을 5마리 처치한다.',           type:'kill', monster:'bear',     goal:5,  rewardExp:400, rewardGold:320 },
  { id:'q6', name:'수련자의 증표', desc:'레벨 10에 도달한다.',            type:'level', goal:10, rewardExp:0,   rewardGold:150 },
  { id:'q7', name:'심연의 문',     desc:'레벨 25에 도달한다.',            type:'level', goal:25, rewardExp:0,   rewardGold:500 },
  { id:'q8', name:'전설의 종막',   desc:'투명드래곤을 1마리 처치한다.',   type:'kill', monster:'dragon',   goal:1,  rewardExp:3000, rewardGold:2500 },
];

/* =========================================================
   상태
   ========================================================= */
let player = null;
let battle = null; // 현재 전투 상태
let saveVersion = "new";

function freshPlayer(nickname){
  return {
    nickname,
    level:1, exp:0, expNeed:60,
    maxHp:80, hp:80, maxMp:30, mp:30,
    baseAtk:8,
    weapon:'wood',
    gold:50,
    inventory:{}, // itemId -> count
    kills:{}, // monsterId -> count
    questClaimed:{}, // questId -> true
    shopPenalty:0, // 억까: 다음 구매 가격 배율 -1이면 없음
    partyId:null, // 파티 ID
    job: '초보자', // 직업
  };
}

/* =========================================================
   유틸
   ========================================================= */
function $(id){ return document.getElementById(id); }
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
}
function log(msg){
  const box = $('log-box');
  box.innerHTML += msg + "\n\n";
  box.scrollTop = box.scrollHeight;
}
function clearLog(){ $('log-box').innerHTML = ""; }
function toast(msg){
  const t = document.createElement('div');
  t.className='toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}
function weaponOf(player){ return WEAPONS.find(w=>w.id===player.weapon); }
function totalAtk(){ return player.baseAtk + weaponOf(player).atk; }
function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* =========================================================
   저장소 헬퍼 & 세이브/로드 시스템
   ========================================================= */
let pendingName = null;
let isAdminUser = false;

// 저장된 세이브 데이터 조회 (localStorage 우선, window.storage 보조)
async function getStoredSave(name){
  if(!name) return null;
  // 1. localStorage 탐색
  try {
    const local = localStorage.getItem('save:' + name);
    if(local) {
      return JSON.parse(local);
    }
  } catch(e){}

  // 2. window.storage 탐색
  if(window.storage && typeof window.storage.get === 'function'){
    try {
      const res = await window.storage.get('save:' + name, false);
      if(res && res.value){
        return JSON.parse(res.value);
      }
    } catch(e){}
  }
  return null;
}

// 세이브 데이터 기록 (localStorage + window.storage 이중 저장)
async function setStoredSave(name, dataObj){
  if(!name || !dataObj) return;
  const jsonStr = JSON.stringify(dataObj);
  // 1. localStorage 저장 및 등록 닉네임 리스트 갱신
  try {
    localStorage.setItem('save:' + name, jsonStr);
    let nickList = [];
    try {
      nickList = JSON.parse(localStorage.getItem('fantasy_rpg_nicknames') || '[]');
    } catch(e){ nickList = []; }
    if(!nickList.some(n => n.toLowerCase() === name.toLowerCase())){
      nickList.push(name);
      localStorage.setItem('fantasy_rpg_nicknames', JSON.stringify(nickList));
    }
  } catch(e){}

  // 2. window.storage 저장
  if(window.storage && typeof window.storage.set === 'function'){
    try {
      await window.storage.set('save:' + name, jsonStr, false);
    } catch(e){}
  }
}

// 닉네임 중복 여부 확인 (대소문자 무관)
async function isNicknameRegistered(name){
  if(!name) return false;
  const lowerName = name.toLowerCase();

  // 1. localStorage 확인
  try {
    if(localStorage.getItem('save:' + name)) return true;
    const nickList = JSON.parse(localStorage.getItem('fantasy_rpg_nicknames') || '[]');
    if(nickList.some(n => n.toLowerCase() === lowerName)) return true;
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.startsWith('save:')){
        const savedName = k.replace('save:', '');
        if(savedName.toLowerCase() === lowerName) return true;
      }
    }
  } catch(e){}

  // 2. window.storage 저장 확인
  if(window.storage && typeof window.storage.get === 'function'){
    try {
      const res = await window.storage.get('save:' + name, false);
      if(res && res.value) return true;
    } catch(e){}
  }

  // 3. 랭킹 기록 확인
  if(window.storage && typeof window.storage.list === 'function'){
    try {
      const listRes = await window.storage.list('leaderboard:', true);
      const keys = (listRes && listRes.keys) || [];
      for(const k of keys){
        const targetName = k.replace('leaderboard:', '');
        if(targetName.toLowerCase() === lowerName) return true;
      }
    } catch(e){}
  }

  return false;
}

async function adminBroadcastDrop(){
  const amountStr = prompt('모든 플레이어(전 세계 모험자)에게 지급할 골드 양을 입력하세요:', '1000');
  if(!amountStr) return;
  const goldAmt = parseInt(amountStr, 10) || 1000;

  let count = 0;
  for(let i=0; i<localStorage.length; i++){
    const key = localStorage.key(i);
    if(key && key.startsWith('save:')){
      try{
        const raw = localStorage.getItem(key);
        if(raw){
          const parsed = JSON.parse(raw);
          const pData = parsed.player ? parsed.player : parsed;
          pData.gold = (pData.gold || 0) + goldAmt;
          pData.inventory = pData.inventory || {};
          pData.inventory['pot_small'] = (pData.inventory['pot_small'] || 0) + 2;
          
          localStorage.setItem(key, JSON.stringify(parsed));
          count++;
        }
      }catch(e){}
    }
  }

  if(window.storage && typeof window.storage.list === 'function'){
    try{
      const listRes = await window.storage.list('save:', false);
      const keys = (listRes && listRes.keys) || [];
      for(const k of keys){
        const res = await window.storage.get(k, false);
        if(res && res.value){
          const parsed = JSON.parse(res.value);
          const pData = parsed.player ? parsed.player : parsed;
          pData.gold = (pData.gold || 0) + goldAmt;
          pData.inventory = pData.inventory || {};
          pData.inventory['pot_small'] = (pData.inventory['pot_small'] || 0) + 2;

          await window.storage.set(k, JSON.stringify(parsed), false);
          count++;
        }
      }
    }catch(e){}
  }

  if(player){
    player.gold += goldAmt;
    player.inventory['pot_small'] = (player.inventory['pot_small'] || 0) + 2;
    refreshSidebar();
    saveGame();
  }

  log(`🎁✨ <b>[관리자 보급 하사]</b> 환상의 세계 전체에 운영자의 은총이 내려졌습니다! (총 ${count}명의 모험자에게 골드 +${goldAmt} 및 소형 체력 물약 x2 지급 완료)`);
  toast(`전체 모험자에게 보급품을 성공적으로 뿌렸습니다!`);
}

/* =========================================================
   억까 이벤트 풀
   ========================================================= */
function maybeUnfairEvent(context){
  // context: 'explore' | 'battle' | 'levelup' | 'shop'
  const chance = context==='battle' ? 0.14 : context==='explore' ? 0.22 : context==='levelup' ? 0.35 : 0.18;
  if(Math.random() > chance) return null;

  const pools = {
    explore: [
      ()=>{ const lost = Math.max(5, Math.round(player.gold*0.15));
            player.gold = Math.max(0, player.gold-lost);
            return `⚡ 맑던 하늘에서 갑자기 벼락이 떨어졌다! 골드 ${lost}이(가) 재가 되어 사라졌다.`; },
      ()=>{ const gain = rand(10,40);
            player.gold += gain;
            return `🍀 길가에서 낯선 자의 지갑을 주웠다... 라고 하기엔 너무 쉽게 ${gain} 골드를 얻었다. (뭔가 찜찜하다)`; },
      ()=>{ return `👁️ 어디선가 ${OPERATOR_NAME}의 시선이 느껴진다... 아무 일도 일어나지 않았다. 그게 더 무섭다.`; },
      ()=>{ const dmg = rand(5, Math.max(6, Math.round(player.maxHp*0.1)));
            player.hp = Math.max(1, player.hp-dmg);
            return `🕳️ 안 보이는 구덩이에 발이 빠졌다! HP ${dmg} 손실. (표지판이라도 좀 세워주지)`; },
      ()=>{ const rainGold = rand(50, 200);
            player.gold += rainGold;
            return `🌧️✨ <b>하늘에서 골드 비가 내린다!</b> 영문은 모르겠지만 반짝이는 골드 ${rainGold}을 주워 담았다!`; },
      ()=>{ const dropKeys = Object.keys(player.inventory);
            player.inventory['낡은 나무검'] = (player.inventory['낡은 나무검']||0) + 1;
            return `🗡️🎁 <b>하늘에서 무기 보따리가 떨어졌다!</b> 낡은 나무검이 인벤토리로 뚝 떨어졌다. (백디몬에게 팔 수 있다)`; },
    ],
    battle: [
      ()=>{ battle.enemy.atk = Math.round(battle.enemy.atk*1.25);
            return `😈 갑자기 ${battle.enemy.name}의 기세가 매서워진다! (공격력 상승, 이거 너무한 거 아닙니까)`; },
      ()=>{ const dmg = rand(4,12);
            player.hp = Math.max(1, player.hp-dmg);
            return `🌪️ 갑작스런 돌풍에 휘말려 HP ${dmg}을 잃었다. 전투와 아무 상관 없는 돌풍이었다.`; },
      ()=>{ battle.playerMiss = true;
            return `🎲 발이 미끄러졌다! 다음 공격이 빗나갈 확률이 높아졌다.`; },
      ()=>{ const heal = rand(8,20);
            battle.enemy.hp = Math.min(battle.enemy.maxHp, battle.enemy.hp+heal);
            return `🩹 ${battle.enemy.name}이(가) 알 수 없는 힘으로 체력을 ${heal} 회복했다. (억까 확정)`; },
    ],
    levelup: [
      ()=>{ return `🎉📢 레벨업을 축하하며 몬스터 무리가 기습한다! ...라고 하기엔 아무것도 안 나타났다. 다행이다.`; },
      ()=>{ const lost = rand(10,30);
            player.gold = Math.max(0, player.gold-lost);
            return `💸 "축하 파티 비용"이라며 알 수 없는 손이 골드 ${lost}을 걷어갔다.`; },
    ],
    shop: [
      ()=>{ player.shopPenalty = 0.2;
            return `🏷️ 백디몬이 씩 웃으며 "오늘은 시세가 좀 올랐어요~" 라고 한다. (다음 구매가 20% 비싸짐)`; },
      ()=>{ return `🐕 백투명강아지가 당신의 신발끈을 잠깐 씹었다. 손해는 없다. 그냥 억까 분위기만 조성됐다.`; },
    ],
  };
  const pool = pools[context] || [];
  if(pool.length===0) return null;
  return pool[rand(0,pool.length-1)]();
}

/* =========================================================
   사냥터 / 탐험
   ========================================================= */
function renderAreaSelect(){
  const area = $('content-area');
  let html = `<h3 style="margin-top:0;color:var(--gold-bright);">사냥터 선택</h3><div class="btn-grid cols1">`;
  AREAS.forEach(a=>{
    const locked = player.level < a.reqLevel;
    html += `<button class="wide" ${locked?'disabled':''} onclick="exploreArea('${a.id}')">
      ${a.name} ${locked?`<span class="tag">Lv.${a.reqLevel} 필요</span>`:`<span class="tag">Lv.${a.reqLevel}+</span>`}
    </button>`;
  });
  html += `</div><div class="back-row"><button onclick="renderTown()">← 마을로</button></div>`;
  area.innerHTML = html;
}

function exploreArea(areaId){
  const area = AREAS.find(a=>a.id===areaId);
  const msg = maybeUnfairEvent('explore');
  if(msg) log(msg);
  refreshSidebar();
  if(player.hp<=1){
    log('당장이라도 쓰러질 것 같다. 전투를 시작할 수 없다. 여관에서 쉬어야 한다.');
    renderAreaSelect();
    return;
  }
  const monsterId = area.monsters[rand(0,area.monsters.length-1)];
  startBattle(monsterId);
}

/* =========================================================
   전투
   ========================================================= */
function scaleMonster(monsterId){
  const def = MONSTERS[monsterId];
  const lvl = Math.max(1, player.level);
  const hp = Math.round((22 + lvl*9) * def.tier);
  const atk = Math.round((4 + lvl*1.9) * def.atier);
  const exp = Math.round((9 + lvl*3.2) * def.tier * (def.boss?1.6:1));
  const gold = Math.round((5 + lvl*2.1) * def.tier * (def.boss?1.6:1));
  return {
    id:monsterId, name:def.name, emoji:def.emoji,
    hp, maxHp:hp, atk, expReward:exp, goldReward:gold,
    dropName:def.dropName, dropVal:def.dropVal,
    dodge:def.dodge||0, thief:def.thief||false, boss:def.boss||false,
  };
}

function startBattle(monsterId){
  battle = { enemy: scaleMonster(monsterId), playerMiss:false, fled:false };
  clearLog();
  log(`<b>${battle.enemy.emoji} ${battle.enemy.name}</b>이(가) 나타났다!`);
  renderBattle();
}

function renderBattle(){
  const e = battle.enemy;
  const area = $('content-area');
  area.innerHTML = `
    <div class="enemy-card">
      <div class="enemy-emoji">${e.emoji}</div>
      <div class="enemy-name">${e.name} ${e.boss?'<span class="tag">BOSS</span>':''}</div>
      <div class="mini-bar-wrap">
        <div class="mini-label"><span>HP</span><span>${e.hp}/${e.maxHp}</span></div>
        <div class="bar-bg"><div class="bar-fill bar-hp" style="width:${e.hp/e.maxHp*100}%;"></div></div>
      </div>
    </div>
    <div class="btn-grid">
      <button class="primary" onclick="battleAttack()">⚔️ 공격</button>
      <button onclick="battleSkill()">✨ 필살기 (MP 15)</button>
      <button onclick="battleItem()">🎒 아이템 사용</button>
      <button class="danger" onclick="battleFlee()">🏃 도주</button>
    </div>
  `;
}

function enemyTurn(){
  const e = battle.enemy;
  if(e.hp<=0 || battle.fled) return;
  let dmg = rand(Math.round(e.atk*0.8), Math.round(e.atk*1.2));
  if(e.thief && Math.random()<0.3){
    const stolen = Math.min(player.gold, rand(5,20));
    player.gold -= stolen;
    log(`${e.emoji} ${e.name}이(가) 골드 ${stolen}을 훔쳐 달아나려 한다!`);
  }
  player.hp = Math.max(0, player.hp-dmg);
  log(`${e.emoji} ${e.name}의 반격! ${dmg}의 피해를 입었다.`);
  if(player.hp<=0){
    onPlayerDown();
  }
}

function battleAttack(){
  const e = battle.enemy;
  let hitChance = 1 - (e.dodge||0) - (battle.playerMiss?0.35:0);
  battle.playerMiss = false;
  if(Math.random() > hitChance){
    log(`${e.emoji}${e.name}의 몸이 흐릿하게 흔들리며 공격이 빗나갔다!`);
  } else {
    const dmg = rand(Math.round(totalAtk()*0.85), Math.round(totalAtk()*1.15));
    e.hp = Math.max(0, e.hp-dmg);
    log(`<b>${player.nickname}</b>의 공격! ${dmg}의 피해.`);
  }
  postPlayerAction();
}

function battleSkill(){
  if(player.mp<15){ toast('MP가 부족하다.'); return; }
  const e = battle.enemy;
  player.mp -= 15;
  let hitChance = 1 - (e.dodge||0)*0.6; // 필살기는 명중률 보정
  if(Math.random() > hitChance){
    log(`필살기를 시전했지만 ${e.name}이(가) 흐릿해지며 스쳐 지나갔다!`);
  } else {
    const dmg = rand(Math.round(totalAtk()*1.5), Math.round(totalAtk()*1.9));
    e.hp = Math.max(0, e.hp-dmg);
    log(`✨ <b>필살기 발동!</b> ${dmg}의 강력한 피해를 입혔다!`);
  }
  postPlayerAction();
}

function battleItem(){
  const owned = Object.keys(player.inventory).filter(id=>{
    const def = ITEMS_SHOP.find(i=>i.id===id);
    return def && player.inventory[id]>0;
  });
  if(owned.length===0){ toast('사용할 소비 아이템이 없다. 백디몬에게 구매하자.'); return; }
  const area = $('content-area');
  let html = `<div class="enemy-card"><div class="enemy-emoji">${battle.enemy.emoji}</div><div class="enemy-name">${battle.enemy.name}</div></div>`;
  html += `<div class="btn-grid cols1">`;
  owned.forEach(id=>{
    const def = ITEMS_SHOP.find(i=>i.id===id);
    html += `<button class="wide" onclick="useItemInBattle('${id}')">${def.name} <span class="tag">보유 ${player.inventory[id]}개</span></button>`;
  });
  html += `<button onclick="renderBattle()">← 취소</button></div>`;
  area.innerHTML = html;
}

function useItemInBattle(id){
  const def = ITEMS_SHOP.find(i=>i.id===id);
  player.inventory[id]--;
  if(def.type==='hp'){
    player.hp = Math.min(player.maxHp, player.hp+def.value);
    log(`${def.name}을(를) 사용했다. HP가 ${def.value} 회복되었다.`);
    postPlayerAction();
  } else if(def.type==='mp'){
    player.mp = Math.min(player.maxMp, player.mp+def.value);
    log(`${def.name}을(를) 사용했다. MP가 ${def.value} 회복되었다.`);
    postPlayerAction();
  } else if(def.type==='flee'){
    log(`${def.name}이(가) 자욱하게 퍼진다! 안전하게 도주했다.`);
    battle.fled = true;
    refreshSidebar();
    saveGame();
    setTimeout(()=>{ renderAreaSelect(); }, 400);
  }
}

function battleFlee(){
  const chance = battle.enemy.boss ? 0.35 : 0.7;
  if(Math.random() < chance){
    log('무사히 도주에 성공했다.');
    battle.fled = true;
    renderAreaSelect();
  } else {
    log('도주에 실패했다!');
    enemyTurn();
    if(player.hp>0) renderBattle();
  }
  refreshSidebar();
}

function postPlayerAction(){
  refreshSidebar();
  const e = battle.enemy;
  if(e.hp<=0){
    onEnemyDefeated();
    return;
  }
  const evMsg = maybeUnfairEvent('battle');
  if(evMsg) log(evMsg);
  enemyTurn();
  refreshSidebar();
  if(player.hp>0){
    renderBattle();
  }
}

function onEnemyDefeated(){
  const e = battle.enemy;
  log(`💀 ${e.name}을(를) 쓰러뜨렸다! EXP +${e.expReward}, 골드 +${e.goldReward}`);
  player.exp += e.expReward;
  player.gold += e.goldReward;
  player.kills[e.id] = (player.kills[e.id]||0)+1;
  if(Math.random()<0.5){
    player.inventory[e.dropName] = (player.inventory[e.dropName]||0)+1;
    log(`전리품 획득: ${e.dropName} x1 (백디몬에게 팔 수 있다)`);
  }
  checkLevelUp();
  checkQuestAuto();
  refreshSidebar();
  saveGame();
  const area = $('content-area');
  area.innerHTML = `<div class="btn-grid cols1">
    <button class="primary" onclick="renderAreaSelect()">사냥터 계속 탐색</button>
    <button onclick="renderTown()">마을로 귀환</button>
  </div>`;
}

function checkLevelUp(){
  let leveled = false;
  while(player.level<50 && player.exp>=player.expNeed){
    player.exp -= player.expNeed;
    player.level++;
    player.expNeed = Math.round(player.expNeed*1.35+20);
    player.maxHp += 18;
    player.maxMp += 6;
    player.baseAtk += 3;
    player.hp = player.maxHp;
    player.mp = player.maxMp;
    leveled = true;
    log(`🌟 <b>레벨 업!</b> 레벨 ${player.level}이(가) 되었다. (최대 HP/MP 증가, 완전 회복)`);
  }
  if(player.level>=50 && player.exp>=player.expNeed){
    player.exp = player.expNeed;
    log('레벨 한계(50)에 도달했다. 더 이상 경험치가 쌓이지 않는다.');
  }
  if(leveled){
    const evMsg = maybeUnfairEvent('levelup');
    if(evMsg) log(evMsg);
  }
  checkQuestLevel();
}

function onPlayerDown(){
  log(`😵 정신을 잃었다... ${OPERATOR_NAME}이(가) 혀를 차는 소리가 들린다.`);
  const lost = Math.round(player.gold*0.2);
  player.gold = Math.max(0, player.gold-lost);
  player.hp = Math.round(player.maxHp*0.5);
  player.mp = Math.round(player.maxMp*0.5);
  battle.fled = true;
  log(`골드 ${lost}을 흘리고 마을로 실려왔다. (억까지만 죽지는 않는다)`);
  refreshSidebar();
  saveGame();
  setTimeout(()=>renderTown(), 300);
}

/* =========================================================
   퀘스트
   ========================================================= */
function questProgress(q){
  if(q.type==='kill') return Math.min(q.goal, player.kills[q.monster]||0);
  if(q.type==='level') return Math.min(q.goal, player.level);
  return 0;
}
function questDone(q){ return questProgress(q) >= q.goal; }

function checkQuestAuto(){ /* 진행도는 kills 기반이라 별도 처리 불필요, UI에서 계산 */ }
function checkQuestLevel(){ /* 레벨 퀘스트도 questProgress에서 즉시 계산됨 */ }

function renderQuests(){
  const area = $('content-area');
  let html = `<h3 style="margin-top:0;color:var(--gold-bright);">퀘스트 게시판</h3>`;
  QUESTS.forEach(q=>{
    const prog = questProgress(q);
    const done = questDone(q);
    const claimed = player.questClaimed[q.id];
    html += `<div class="quest-card ${done?'done':''}">
      <div class="quest-title">${q.name} ${claimed?'<span class="tag">완료</span>':''}</div>
      <div class="quest-desc">${q.desc}</div>
      <div class="quest-progress">진행도 ${prog}/${q.goal} · 보상: EXP ${q.rewardExp} / 골드 ${q.rewardGold}</div>
      ${(!claimed) ? `<div style="margin-top:8px;"><button ${done?'':'disabled'} onclick="claimQuest('${q.id}')">보상 받기</button></div>` : ''}
    </div>`;
  });
  html += `<div class="back-row"><button onclick="renderTown()">← 마을로</button></div>`;
  area.innerHTML = html;
}

function claimQuest(id){
  const q = QUESTS.find(q=>q.id===id);
  if(!questDone(q) || player.questClaimed[id]) return;
  player.questClaimed[id] = true;
  player.exp += q.rewardExp;
  player.gold += q.rewardGold;
  log(`📜 퀘스트 완료: <b>${q.name}</b> — EXP +${q.rewardExp}, 골드 +${q.rewardGold}`);
  checkLevelUp();
  refreshSidebar();
  saveGame();
  renderQuests();
}

/* =========================================================
   상점 — 백투명강아지 (무기)
   ========================================================= */
function renderWeaponShop(){
  const area = $('content-area');
  let html = `<h3 style="margin-top:0;color:var(--gold-bright);">🐕‍🦺 백투명강아지의 무기 상점</h3>
  <p class="flavor">"컹! 원하는 무기가 있나 잘 봐. 안 보인다고 없는 게 아니야."</p>`;
  WEAPONS.forEach(w=>{
    const owned = player.weapon===w.id;
    const locked = player.level < w.reqLevel;
    const price = Math.round(w.price*(1+player.shopPenalty));
    html += `<div class="shop-item">
      <div class="info"><b>${w.name}</b> <span class="tag">공격력 +${w.atk}</span> ${locked?`<span class="tag">Lv.${w.reqLevel} 필요</span>`:''}
        <div class="desc">${w.price===0?'기본 지급 무기':price+' 골드'}</div>
      </div>
      <div>
        ${owned ? `<button disabled>장착중</button>` :
          `<button ${locked?'disabled':''} onclick="buyWeapon('${w.id}')">${w.price===0?'장착':'구매'}</button>`}
      </div>
    </div>`;
  });
  html += `<div class="back-row"><button onclick="renderTown()">← 마을로</button></div>`;
  area.innerHTML = html;
}

function buyWeapon(id){
  const w = WEAPONS.find(w=>w.id===id);
  const price = Math.round(w.price*(1+player.shopPenalty));
  if(player.gold < price){ toast('골드가 부족하다.'); return; }
  player.gold -= price;
  player.weapon = id;
  player.shopPenalty = 0;
  log(`🗡️ <b>${w.name}</b>을(를) 구매하여 장착했다.`);
  const evMsg = maybeUnfairEvent('shop');
  if(evMsg) log(evMsg);
  refreshSidebar();
  saveGame();
  renderWeaponShop();
}

/* =========================================================
   상점 — 백디몬 (잡화 / 판매)
   ========================================================= */
function renderItemShop(){
  const area = $('content-area');
  let html = `<h3 style="margin-top:0;color:var(--gold-bright);">😈 백디몬의 잡화상점</h3>
  <p class="flavor">"어서 와. 사도 좋고, 팔아도 좋고. 오늘 기분에 따라 시세가 좀 다를 수도 있어."</p>
  <h4 style="color:var(--parchment);margin-bottom:6px;">구매</h4>`;
  ITEMS_SHOP.forEach(it=>{
    const price = Math.round(it.price*(1+player.shopPenalty));
    html += `<div class="shop-item">
      <div class="info"><b>${it.name}</b><div class="desc">${it.desc} · ${price} 골드</div></div>
      <button onclick="buyItem('${it.id}')">구매</button>
    </div>`;
  });
  const junk = Object.keys(player.inventory).filter(k=>!ITEMS_SHOP.find(i=>i.id===k) && player.inventory[k]>0);
  html += `<h4 style="color:var(--parchment);margin:14px 0 6px;">판매 (전리품)</h4>`;
  if(junk.length===0){
    html += `<p class="flavor">팔 수 있는 전리품이 없다.</p>`;
  } else {
    junk.forEach(name=>{
      const mDef = Object.values(MONSTERS).find(m=>m.dropName===name);
      const val = mDef ? mDef.dropVal : 10;
      html += `<div class="shop-item">
        <div class="info"><b>${name}</b><div class="desc">보유 ${player.inventory[name]}개 · 개당 ${val} 골드</div></div>
        <button onclick="sellItem('${name.replace(/'/g,"\\'")}',${val})">판매</button>
      </div>`;
    });
  }
  html += `<div class="back-row"><button onclick="renderTown()">← 마을로</button></div>`;
  area.innerHTML = html;
}

function buyItem(id){
  const it = ITEMS_SHOP.find(i=>i.id===id);
  const price = Math.round(it.price*(1+player.shopPenalty));
  if(player.gold < price){ toast('골드가 부족하다.'); return; }
  player.gold -= price;
  player.inventory[id] = (player.inventory[id]||0)+1;
  player.shopPenalty = 0;
  log(`🧪 ${it.name}을(를) 구매했다.`);
  const evMsg = maybeUnfairEvent('shop');
  if(evMsg) log(evMsg);
  refreshSidebar();
  saveGame();
  renderItemShop();
}

function sellItem(name,val){
  if(!player.inventory[name] || player.inventory[name]<=0) return;
  player.inventory[name]--;
  player.gold += val;
  log(`${name}을(를) 팔아 ${val} 골드를 받았다.`);
  refreshSidebar();
  saveGame();
  renderItemShop();
}

/* =========================================================
   파티 및 멀티플레이어 시스템
   ========================================================= */
async function renderPartyHub(){
  const area = $('content-area');
  area.innerHTML = `<h3 style="margin-top:0;color:var(--gold-bright);">🛡️ 모험자 파티 허브</h3><p class="flavor">온라인 파티 목록을 불러오는 중...</p><div class="back-row"><button onclick="renderTown()">← 마을로</button></div>`;
  
  try{
    const listRes = await window.storage.list('party:', true);
    const keys = (listRes && listRes.keys) || [];
    const parties = [];
    for(const k of keys){
      try{
        const r = await window.storage.get(k, true);
        if(r && r.value) parties.push(JSON.parse(r.value));
      }catch(e){}
    }

    let html = `<h3 style="margin-top:0;color:var(--gold-bright);">🛡️ 모험자 파티 허브</h3>
    <p class="flavor">다른 플레이어들과 파티를 결성하여 함께 사냥하고 강력한 보스(서리안)에 도전하세요.</p>`;

    if(player.partyId){
      const myParty = parties.find(p=>p.id===player.partyId);
      html += `<div style="background:var(--bg-deep);border:1px solid var(--gold);padding:14px;border-radius:4px;margin-bottom:14px;">
        <h4 style="margin:0 0 6px 0;color:var(--gold-bright);">현재 소속 파티: ${myParty ? myParty.name : player.partyId}</h4>
        <p class="flavor" style="margin:0 0 10px 0;">파티원: ${(myParty && myParty.members)?myParty.members.join(', '):player.nickname}</p>
        <button class="danger" onclick="leaveParty()">파티 탈퇴하기</button>
      </div>`;
    } else {
      html += `<div style="margin-bottom:14px;">
        <button class="primary" onclick="createPartyPrompt()">✨ 새 파티 만들기</button>
      </div>`;
    }

    html += `<h4 style="color:var(--parchment);margin:14px 0 8px;">활성화된 파티 목록</h4>`;
    if(parties.length===0){
      html += `<p class="flavor">생성된 파티가 없습니다. 새 파티를 만들어보세요!</p>`;
    } else {
      parties.forEach(p=>{
        const isJoined = player.partyId === p.id;
        html += `<div class="shop-item">
          <div class="info"><b>${p.name}</b> (파티장: ${p.leader})<div class="desc">파티원: ${(p.members||[]).join(', ')}</div></div>
          <div>${isJoined ? '<span class="tag">소속됨</span>' : `<button onclick="joinParty('${p.id}')">가입</button>`}</div>
        </div>`;
      });
    }

    html += `<div class="back-row"><button onclick="renderTown()">← 마을로</button></div>`;
    area.innerHTML = html;
  }catch(e){
    area.innerHTML = `<h3 style="margin-top:0;color:var(--gold-bright);">🛡️ 모험자 파티 허브</h3><p class="flavor">파티 정보를 불러오지 못했습니다.</p><div class="back-row"><button onclick="renderTown()">← 마을로</button></div>`;
  }
}

async function createPartyPrompt(){
  const partyName = prompt('생성할 파티 이름을 입력하세요:', player.nickname + '의 파티');
  if(!partyName) return;
  const partyId = 'party_' + Date.now();
  const partyData = {
    id: partyId,
    name: partyName,
    leader: player.nickname,
    members: [player.nickname],
    updated: Date.now()
  };
  try{
    await window.storage.set('party:'+partyId, JSON.stringify(partyData), true);
    player.partyId = partyId;
    toast('파티가 생성되었습니다!');
    saveGame();
    renderPartyHub();
  }catch(e){
    toast('파티 생성에 실패했습니다.');
  }
}

async function joinParty(partyId){
  try{
    const res = await window.storage.get('party:'+partyId, true);
    if(res && res.value){
      const partyData = JSON.parse(res.value);
      if(!partyData.members.includes(player.nickname)){
        partyData.members.push(player.nickname);
        await window.storage.set('party:'+partyId, JSON.stringify(partyData), true);
      }
      player.partyId = partyId;
      toast('파티에 가입했습니다!');
      saveGame();
      renderPartyHub();
    }
  }catch(e){
    toast('파티 가입에 실패했습니다.');
  }
}

function renderWorldMap(){
  const area = $('content-area');
  let html = `
    <h3 style="margin-top:0;color:var(--gold-bright);">🗺️ 세계 지도 (월드 맵)</h3>
    <p class="flavor">환상의 세계 전역을 한눈에 조망할 수 있는 지도입니다. 원하는 구역으로 즉시 이동하세요.</p>
    <div class="btn-grid cols1" style="margin-top:10px;">
      <button class="primary wide" onclick="renderTown()">🏘️ 안개 마을 광장 (허브)</button>
  `;
  AREAS.forEach(a=>{
    const locked = player.level < a.reqLevel;
    html += `<button class="wide" ${locked?'disabled':''} onclick="renderTown(); exploreArea('${a.id}')">
      ⚔️ ${a.name} 구역 탐험 ${locked?`<span class="tag">Lv.${a.reqLevel} 필요</span>`:`<span class="tag">입장 가능</span>`}
    </button>`;
  });
  html += `</div><div class="back-row" style="margin-top:16px;"><button onclick="renderTown()">← 마을로</button></div>`;
  area.innerHTML = html;
}
